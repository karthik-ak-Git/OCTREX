[package]
name = "octrex-core"
version = "4.0.0"
edition = "2021"
description = "OCTREX Autonomous AI Engineering Core Engine in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1"
sysinfo = "0.30"
regex = "1.10"
url = "2.5"
